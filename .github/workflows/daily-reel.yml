name: Daily Reel Delivery

on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * *'

permissions:
  contents: read

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  create-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
      GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
      EPISODE_START_DATE: ${{ vars.EPISODE_START_DATE }}
    steps:
      - name: Check out content
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate original story and social copy
        run: node scripts/generate-episode.mjs

      - name: Select approved BGM and render props
        run: node scripts/prepare-render.mjs

      - name: Render vertical Reel
        run: npm exec -- remotion render src/index.tsx StoriesThatStay out/reel.mp4 --props out/render-props.json

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: |
            out/reel.mp4
            out/episode.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Reel to Google Drive and update spreadsheet
        run: node scripts/deliver-to-google.mjs
